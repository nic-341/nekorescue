<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f1e6"><title>ネコ救出作戦！ | NEKO RESCUE</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="app"><header><a class="brand" href="./">ネコ救出作戦<span>NEKO RESCUE CLUB</span></a><button id="settings" class="icon" aria-label="音の設定">♫</button></header><section class="intro"><span class="eyebrow">A LITTLE PUZZLE, A BIG MEOW.</span><h1>ひらめきで、<br>この子を助けよう。</h1><p>ピンを抜いて、危険をなくして。おうちまであと少し。</p></section><section class="game"><div class="stage-head"><div><span id="stageNumber">STAGE 01</span><h2 id="stageTitle"></h2></div><button id="stageSelect" aria-label="ステージを選ぶ">01 / 05 ▦</button></div><div class="canvas-wrap"><canvas id="board" width="420" height="560" aria-label="猫を助けるパズル"></canvas><div id="actionButtons" class="action-buttons"></div><div id="result" class="result" hidden><div class="result-card"><div id="stars" class="stars">★ ★ ★</div><h2 id="resultTitle"></h2><p id="resultText"></p><button id="continue" class="primary"></button></div></div></div><div class="message" id="message" aria-live="polite"></div><footer><button id="retry">↻ <span>やり直す</span></button><button id="hint">✦ <span>ヒント</span></button></footer></section><p class="bottom-note">ひとつずつ、あわてずに。猫はあなたを信じています。</p><dialog id="settingsDialog"><h2>音の設定</h2><label>BGM <input id="bgm" type="checkbox"></label><label>効果音 <input id="se" type="checkbox"></label><label>音量 <input id="volume" type="range" min="0" max="1" step="0.05"></label><button class="primary" id="closeSettings">とじる</button></dialog><dialog id="stageDialog"><h2>おうちへの道</h2><div id="stageList"></div><button id="closeStages" class="primary">とじる</button></dialog></main><script src="js/stages.js"></script><script src="js/audio.js"></script><script src="js/game.js"></script></body></html>
